services:
  postgres:
    image: postgres:14-alpine
    container_name: smartfit-postgres-workout
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smartfitai_workouts
    ports:
      - "5432:5432"
    volumes:
      - postgres_workout_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - workout-network

  workout-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartfit-workout-service-dev
    ports:
      - "8081:8081"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - KUMULUZEE_PORT=8081
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - workout-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/v1/workouts/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_workout_data:

networks:
  workout-network:
    driver: bridge
